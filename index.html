<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#15122b">
<meta name="robots" content="noindex">
<title>O Ano em Revista</title>
<style>
:root{
  --bg:#15122b; --bg2:#221d44; --bg3:#2e2859; --line:#463e7d; --ink:#f7f4ff; --mut:#b4aed6; --dark:#15122b;
  --good:#3ddc97; --bad:#ff6b6b; --acc:#b388ff;
  --u:min(1vw,1.78vh);
  --font:"Avenir Next","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (max-aspect-ratio: 1/1){ :root{ --u:1.75vw; } }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;font-weight:600}
body[data-cat=numbers]{--acc:#4cc9f0} body[data-cat=habits]{--acc:#3ddc97} body[data-cat=quotes]{--acc:#ffb627}
body[data-cat=history]{--acc:#b388ff} body[data-cat=awards]{--acc:#ff7eb6} body[data-cat=gold]{--acc:#ffd23f}
#bgfx{position:fixed;inset:0;z-index:0;transition:background 1s;
  background:
   radial-gradient(60vmax 60vmax at -10% -20%, color-mix(in srgb,var(--acc) 38%,transparent), transparent 62%),
   radial-gradient(55vmax 55vmax at 112% 118%, color-mix(in srgb,var(--acc) 30%,transparent), transparent 60%),
   radial-gradient(30vmax 30vmax at 100% -10%, #ffffff0d, transparent 70%), var(--bg)}
#bgfx::before,#bgfx::after{content:"";position:absolute;border-radius:50%;border:calc(var(--u)*1.2) solid color-mix(in srgb,var(--acc) 22%,transparent)}
#bgfx::before{width:34vmax;height:34vmax;left:-12vmax;bottom:-14vmax}
#bgfx::after{width:22vmax;height:22vmax;right:-7vmax;top:-9vmax;border-style:dashed}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;height:100dvh}
#stage{flex:1;min-height:0;position:relative;display:flex}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none;width:100%;height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- shared bits ---------- */
.av{--s:3em;width:var(--s);height:var(--s);flex:none;display:inline-grid;place-items:center;background:var(--c,#888);color:var(--dark);
  font-weight:900;font-size:calc(var(--s)*.4);letter-spacing:-.02em;border-radius:50%;position:relative;box-shadow:0 .12em 0 #0006}
.av.s1{border-radius:28%} .av.s2{border-radius:50% 50% 50% 14%} .av.s3{border-radius:18% 50% 18% 50%}
.av.s4{border-radius:50% 14% 50% 50%} .av.s5{border-radius:38% 38% 50% 50%}
.av.off{filter:grayscale(1) brightness(.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.75em 1.3em;border-radius:.8em;background:var(--bg3);
  border:2px solid var(--line);font-weight:800;line-height:1.1;min-height:48px;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--dark);border-color:var(--ink)}
.btn.acc{background:var(--acc);color:var(--dark);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.kicker{text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.25em .8em;border-radius:99px;background:var(--acc);color:var(--dark);font-weight:900;
  text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.chip.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.chip.x2{background:#ffd23f}
.mut{color:var(--mut)}
@keyframes in{from{opacity:0;transform:translateY(.8em)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes stamp{0%{opacity:0;transform:scale(3) rotate(-18deg)}60%{opacity:1;transform:scale(.92) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dots{0%,20%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.stg{opacity:0;animation:in .5s var(--d,0s) cubic-bezier(.2,.8,.2,1) forwards}
.stg.pop{animation-name:pop;animation-duration:.6s}
.stg.stamp{animation-name:stamp;animation-duration:.5s}

/* ---------- host / big screen ---------- */
.screen{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(var(--u)*2.2) calc(var(--u)*5);gap:calc(var(--u)*1.7);font-size:max(15px,calc(var(--u)*2));overflow:hidden auto;justify-content:flex-start}
.screen>*{flex:none}
.screen::before,.screen::after{content:"";flex:1 0 0px}
.screen h1{font-size:calc(var(--u)*9);line-height:.95;font-weight:900;letter-spacing:-.03em;text-wrap:balance}
.screen h2{font-size:calc(var(--u)*5.4);line-height:1.02;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.screen .sub{font-size:max(16px,calc(var(--u)*2.6));color:var(--mut);text-wrap:balance;max-width:44em}
.screen .kicker{font-size:max(13px,calc(var(--u)*1.8))}
.topline{order:-1;width:calc(100% + var(--u)*4);margin:0 calc(var(--u)*-2);display:flex;align-items:center;gap:calc(var(--u)*1.2);
  font-size:max(12px,calc(var(--u)*1.55));z-index:3;flex-wrap:wrap}
.topline .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:max(20px,calc(var(--u)*3.4));min-width:2.2em;height:2.2em;border-radius:50%;
  display:grid;place-items:center;border:.14em solid var(--acc);background:var(--bg2)}
.timer.low{border-color:var(--bad);color:var(--bad);animation:pulse .5s infinite}
.prompt{font-size:calc(var(--u)*5);line-height:1.05;font-weight:900;letter-spacing:-.02em;text-wrap:balance;max-width:17em}
.prompt.small{font-size:calc(var(--u)*3.2)}
.qcard{background:var(--ink);color:var(--dark);border-radius:calc(var(--u)*2.5);padding:calc(var(--u)*3) calc(var(--u)*4.5);max-width:calc(var(--u)*76);
  font-size:calc(var(--u)*4.2);line-height:1.12;font-weight:800;letter-spacing:-.01em;position:relative;text-wrap:balance;box-shadow:0 calc(var(--u)*.8) 0 var(--acc);transform:rotate(-1deg)}
.qcard::before{content:"\201C";position:absolute;left:calc(var(--u)*-1.5);top:calc(var(--u)*-5);font-size:calc(var(--u)*16);line-height:1;color:var(--acc);font-family:Georgia,serif}
.qcard.long{font-size:calc(var(--u)*3.1)}
.qcard span,.ph .quote span{display:block}
.qcard span+span,.ph .quote span+span{margin-top:.35em}
.answered{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1.6);justify-content:center;font-size:max(14px,calc(var(--u)*1.7))}
.answered .who{display:flex;flex-direction:column;align-items:center;gap:.3em;opacity:.45;transition:opacity .2s,transform .2s;position:relative}
.answered .who .av{--s:calc(var(--u)*6.4);min-width:38px;min-height:38px}
.answered .who.done{opacity:1;transform:translateY(-.5em)}
.answered .who.done .av::after{content:"✓";position:absolute;right:-.3em;bottom:-.3em;width:1.3em;height:1.3em;border-radius:50%;background:var(--good);color:var(--dark);display:grid;place-items:center;font-size:.6em}
.answered .who.offl .av{filter:grayscale(1) brightness(.6)}
.answered .who.offl::after{content:"sem ligação";font-size:.7em;color:var(--bad)}
.hint{font-size:max(14px,calc(var(--u)*2));color:var(--mut)}
.dots i{animation:dots 1.2s infinite;font-style:normal} .dots i:nth-child(2){animation-delay:.2s} .dots i:nth-child(3){animation-delay:.4s}

/* landing + lobby */
.modes{display:flex;gap:calc(var(--u)*2.5);flex-wrap:wrap;justify-content:center;align-items:stretch}
.mode{width:calc(var(--u)*36);min-width:260px;max-width:92vw;text-align:left;background:var(--bg2);border:3px solid var(--line);border-radius:calc(var(--u)*2);
  padding:calc(var(--u)*2.4);display:flex;flex-direction:column;gap:.5em;transition:transform .12s,border-color .12s}
.mode:hover,.mode:focus-visible{transform:translateY(-4px);border-color:var(--acc)}
.mode b{font-size:max(20px,calc(var(--u)*3));font-weight:900}
.mode span{color:var(--mut);font-size:max(14px,calc(var(--u)*1.7));font-weight:600}
.mode .chip{color:var(--dark)} .mode .chip.ghost{color:var(--ink)}
.mode .tag{align-self:flex-start;font-size:max(11px,calc(var(--u)*1.2))}
.lobby{flex-direction:row;gap:calc(var(--u)*4);text-align:left;align-items:center;justify-content:center}
.lobby::before,.lobby::after{display:none}
.lobby .join{display:flex;flex-direction:column;gap:calc(var(--u)*1.4);align-items:flex-start;flex:0 1 auto;max-width:32%;min-width:0}
.lobby .roster{flex:1 1 40%;min-width:0;display:flex;flex-direction:column;gap:calc(var(--u)*1.5)}
.code{font-size:calc(var(--u)*8.5);font-weight:900;letter-spacing:.1em;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.url{font-size:max(15px,calc(var(--u)*2.5));font-weight:800;word-break:break-all;background:var(--bg2);padding:.3em .6em;border-radius:.4em}
.qr{background:#fff;padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*1.5);line-height:0}
.qr svg,.qr img{width:calc(var(--u)*20);height:calc(var(--u)*20);min-width:150px;min-height:150px;display:block}
.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:calc(var(--u)*1.2)}
.seat{display:flex;align-items:center;gap:.7em;background:var(--bg2);border:2px solid var(--line);border-radius:calc(var(--u)*1.4);padding:.5em .8em;
  font-size:max(16px,calc(var(--u)*2.2));font-weight:800;opacity:.5;transition:all .25s;min-width:0;text-align:left}
.seat .av{--s:1.6em} .seat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.seat.in{opacity:1;border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.seat:not(.offl):not(.g) small{display:none}
.seat small{font-size:.55em;color:var(--mut);font-weight:700;white-space:nowrap}
.seat.in.offl small{color:var(--bad)}
.field{display:flex;gap:.5em;flex-wrap:wrap;align-items:center;justify-content:center}
.field input[type=text],.field input[type=url]{background:var(--bg2);border:2px solid var(--line);border-radius:.6em;padding:.6em .8em;min-height:48px;min-width:0;flex:1;
  -webkit-user-select:text;user-select:text;font-weight:700}
.warn{background:#ffb62722;border:2px solid #ffb627;border-radius:.8em;padding:.7em 1em;font-size:max(14px,calc(var(--u)*1.7));max-width:38em;text-align:left;font-weight:600}
label.tog{display:flex;align-items:center;gap:.6em;font-size:max(15px,calc(var(--u)*1.9));cursor:pointer;text-align:left}
label.tog input{width:1.5em;height:1.5em;accent-color:var(--acc);flex:none}

/* rules / cards */
.rules{display:flex;gap:calc(var(--u)*2.5);flex-wrap:wrap;justify-content:center}
.rule{width:calc(var(--u)*26);min-width:220px;background:var(--bg2);border-radius:calc(var(--u)*2);padding:calc(var(--u)*2.2);display:flex;flex-direction:column;gap:.5em;align-items:center;border:2px solid var(--line)}
.rule .n{width:2em;height:2em;border-radius:50%;background:var(--acc);color:var(--dark);display:grid;place-items:center;font-weight:900;font-size:max(20px,calc(var(--u)*3))}
.rule b{font-size:max(18px,calc(var(--u)*2.6));font-weight:900;line-height:1.1}
.rule span{font-size:max(14px,calc(var(--u)*1.8));color:var(--mut)}
.catcard h1{font-size:calc(var(--u)*13)}
.catcard .n{font-size:calc(var(--u)*3);font-weight:900;color:var(--acc)}

/* reveal pieces */
.rev{gap:calc(var(--u)*1.4)}
.rev .prompt{font-size:calc(var(--u)*2.4);color:var(--mut);font-weight:800;max-width:30em}
.ansline{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*2);flex-wrap:wrap}
.ansline .av{--s:calc(var(--u)*8)}
.ansline .nm{font-size:calc(var(--u)*7);font-weight:900;letter-spacing:-.03em;line-height:1}
.ansline .amp{font-size:calc(var(--u)*4);color:var(--mut);font-weight:900}
.rank{display:flex;flex-direction:column;gap:calc(var(--u)*.7);width:min(100%,calc(var(--u)*78));font-size:max(13px,calc(var(--u)*1.75))}
.rank .row{display:grid;grid-template-columns:1.6em 2em 5.2em 1fr;align-items:center;gap:.6em;text-align:left}
.rank .row .pos{font-weight:900;color:var(--mut);text-align:right}
.rank .row .av{--s:1.8em}
.rank .row .nm{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .row .barw{display:flex;align-items:center;gap:.6em;min-width:0}
.rank .row .bar{width:calc(var(--w)*var(--bs,1));height:1.5em;border-radius:0 4px 4px 0;background:var(--c);transform-origin:left;animation:grow .7s var(--d,0s) cubic-bezier(.2,.8,.2,1) both;min-width:4px;flex:none}
.rank .row .lab{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rank .row.top .nm,.rank .row.top .lab{color:#fff}
.rank .row.top{font-size:1.15em}
.note{font-size:max(17px,calc(var(--u)*2.9));font-weight:800;font-style:italic;background:var(--bg2);border-left:.3em solid var(--acc);padding:.5em 1em;border-radius:.3em;max-width:32em;text-wrap:balance;text-align:left}
.gains{display:flex;gap:calc(var(--u)*1.4);flex-wrap:wrap;justify-content:center;font-size:max(12px,calc(var(--u)*1.6))}
.gain{flex:none;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:.6em;align-items:center;text-align:left;padding:.3em .9em .3em .35em;border-radius:99px;background:var(--bg2);border:2px solid var(--line)}
.gain .av{--s:2.5em;grid-row:1 / 3}
.gain .pts{font-weight:900;font-size:1.25em;line-height:1;font-variant-numeric:tabular-nums;align-self:end}
.gain .said{color:var(--mut);font-weight:700;font-size:.85em;line-height:1.1;white-space:nowrap;max-width:8em;overflow:hidden;text-overflow:ellipsis;align-self:start}
.gain.good{border-color:var(--good)} .gain.good .pts{color:var(--good)}
.gain.part{border-color:#ffd23f} .gain.part .pts{color:#ffd23f}
.gain.zero{opacity:.6}
.bigstamp{font-size:calc(var(--u)*11);font-weight:900;letter-spacing:.02em;line-height:1;padding:.12em .4em;border:.09em solid currentColor;border-radius:.2em;transform:rotate(-6deg)}
.bigstamp.t{color:var(--good)} .bigstamp.f{color:var(--bad)}
.bignum{font-size:calc(var(--u)*12);font-weight:900;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-size:.3em;color:var(--mut);letter-spacing:0;margin-left:.3em}
.numline{position:relative;width:min(100%,calc(var(--u)*80));height:calc(var(--u)*13)}
.numline .axis{position:absolute;left:0;right:0;top:72%;height:4px;background:var(--line);border-radius:2px}
.numline .end{position:absolute;top:80%;font-size:max(12px,calc(var(--u)*1.5));color:var(--mut);font-variant-numeric:tabular-nums}
.numline .g{position:absolute;top:72%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.numline .g .av{--s:calc(var(--u)*3.6);min-width:26px;min-height:26px}
.numline .g i{width:2px;background:var(--c);display:block}
.numline .truth{position:absolute;top:0;bottom:28%;width:4px;background:#fff;transform:translateX(-50%);transform-origin:bottom;animation:growY .5s var(--d) both;border-radius:2px}
.numline .truth::after{content:"";position:absolute;left:50%;bottom:-6px;width:16px;height:16px;border-radius:50%;background:#fff;transform:translateX(-50%)}
.tfcols{display:flex;gap:calc(var(--u)*6);justify-content:center}
.tfcols .col{display:flex;flex-direction:column;align-items:center;gap:.5em;font-size:max(13px,calc(var(--u)*1.7));font-weight:800;color:var(--mut)}
.tfcols .col .avs{display:flex;gap:.4em;min-height:2.6em}
.tfcols .col.win{color:var(--good)}
.award .rays{position:relative;display:grid;place-items:center;width:calc(var(--u)*18);height:calc(var(--u)*18)}
.award h1{font-size:calc(var(--u)*7)}
.award .rays::before{content:"";position:absolute;inset:-35%;border-radius:50%;animation:spin 14s linear infinite;
  background:repeating-conic-gradient(from 0deg, color-mix(in srgb,var(--acc) 50%,transparent) 0 10deg, transparent 10deg 20deg);
  -webkit-mask:radial-gradient(circle, #000 30%, transparent 70%);mask:radial-gradient(circle, #000 30%, transparent 70%)}
.award .rays .av{--s:calc(var(--u)*14);z-index:1}
.award .star{position:absolute;z-index:2;right:0;bottom:0;width:calc(var(--u)*7);height:calc(var(--u)*7)}
.runners{display:flex;gap:1em;align-items:center;font-size:max(14px,calc(var(--u)*1.8));color:var(--mut);flex-wrap:wrap;justify-content:center}
.runners .r{display:flex;gap:.4em;align-items:center;color:var(--ink);font-weight:800} .runners .av{--s:1.8em}
.chart{width:min(100%,calc(var(--u)*86))}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:#ffffff1f;stroke-width:1}
.chart text{fill:var(--mut);font-size:15px;font-weight:700}
.chart text.dl{fill:var(--ink);font-size:17px;font-weight:900}
.chart .ln{fill:none;stroke-width:4;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .4s ease-out forwards}
.chart .pt{stroke:var(--bg);stroke-width:2}
.chart .tip{pointer-events:none}
.legend{display:flex;gap:1.4em;justify-content:center;font-size:max(13px,calc(var(--u)*1.7));font-weight:800}
.legend i{display:inline-block;width:1em;height:.35em;border-radius:2px;margin-right:.4em;vertical-align:middle}

/* scores + podium */
.board{display:flex;flex-direction:column;gap:calc(var(--u)*.9);width:min(100%,calc(var(--u)*74));font-size:max(15px,calc(var(--u)*2.5))}
.board .row{display:grid;grid-template-columns:1.4em 2em 7em 1fr 4.6em;gap:.6em;align-items:center;text-align:left;font-weight:900}
.board .row .av{--s:2em}
.board .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .row .pos{color:var(--mut);text-align:right}
.board .row .bar{height:1.3em;background:var(--c);border-radius:0 4px 4px 0;transform-origin:left;animation:grow .9s var(--d,0s) cubic-bezier(.2,.8,.2,1) both;min-width:4px}
.board .row .sc{text-align:right;font-variant-numeric:tabular-nums}
.board .row .mv{font-size:.6em;margin-left:.3em} .mv.up{color:var(--good)} .mv.dn{color:var(--bad)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:calc(var(--u)*2);min-height:calc(var(--u)*30);width:100%}
.podium .p{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.8);width:calc(var(--u)*20)}
.podium .p .av{--s:calc(var(--u)*9)}
.podium .p .avs{display:flex;gap:.3em;flex-wrap:wrap;justify-content:center}
.podium .p .nm{font-size:calc(var(--u)*3);font-weight:900;line-height:1}
.podium .p .sc{font-size:calc(var(--u)*2);color:var(--mut);font-variant-numeric:tabular-nums;font-weight:800}
.podium .p .blk{width:100%;border-radius:calc(var(--u)*1.2) calc(var(--u)*1.2) 0 0;background:var(--bg3);border:2px solid var(--line);border-bottom:0;display:grid;place-items:center;
  font-size:calc(var(--u)*7);font-weight:900;transform-origin:bottom;animation:growY .6s var(--d) cubic-bezier(.2,.8,.2,1) both}
.podium .p1 .blk{height:calc(var(--u)*15);background:#ffd23f;color:var(--dark);border-color:#ffd23f}
.podium .p2 .blk{height:calc(var(--u)*10.5)} .podium .p3 .blk{height:calc(var(--u)*7)}
.podium .p1 .av{--s:calc(var(--u)*11)}
.rest{display:flex;gap:calc(var(--u)*2.2);flex-wrap:wrap;justify-content:center;font-size:max(14px,calc(var(--u)*1.9));font-weight:800}
.rest .r{display:flex;align-items:center;gap:.4em} .rest .av{--s:1.9em} .rest .r .sc{color:var(--mut);font-variant-numeric:tabular-nums}

/* host bar */
.hostbar{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0d0b1dcc;border-top:1px solid #ffffff14;font-size:15px;z-index:5}
.hostbar .sp{flex:1}
.hostbar .hb{min-width:44px;min-height:44px;padding:0 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.hostbar .hb:disabled{opacity:.35}
.hostbar .hb.next{background:var(--ink);color:var(--dark);border-color:var(--ink);padding:0 20px;font-size:17px}
.hostbar .prog{color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.hostbar svg{width:18px;height:18px;fill:currentColor;flex:none}
@media (max-width:700px){ .hostbar .hb span.t{display:none} .hostbar .hb.next span.t{display:inline} .hostbar{gap:5px;padding:6px} .hostbar .prog{display:none}
  .hostbar .hb{min-width:40px;padding:0 8px;justify-content:center} .hostbar .hb.next{padding:0 10px;font-size:15px} .hostbar .hb.next svg{display:none} }
.pausedveil{position:absolute;inset:0;z-index:20;background:#0d0b1de6;display:grid;place-items:center;font-size:calc(var(--u)*8);font-weight:900}
.modal{position:fixed;inset:0;z-index:60;background:#0d0b1dd9;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:20px;width:min(560px,100%);max-height:90dvh;overflow:auto;display:flex;flex-direction:column;gap:12px;font-size:16px;text-align:left}
.modal h3{font-size:22px;font-weight:900}
.modal .prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #ffffff14}
.modal .prow .av{--s:34px} .modal .prow .nm{flex:1;font-weight:800} .modal .prow .btn{min-height:40px;padding:.4em .8em;font-size:14px}
.modal .acts{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- answer widgets (phones and one-screen turns) ---------- */
.aw{width:100%;display:flex;flex-direction:column;gap:.8em;align-items:stretch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.opt{display:flex;align-items:center;gap:.6em;padding:.65em .7em;border-radius:.9em;background:var(--bg2);border:3px solid var(--line);font-weight:900;font-size:1.15em;text-align:left;min-height:64px;min-width:0;transition:transform .08s}
.opt .av{--s:2.2em} .opt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt:active{transform:scale(.97)}
.opt.sel{background:var(--c,var(--acc));border-color:#fff;color:var(--dark)}
.opt.sel .av{box-shadow:0 0 0 3px var(--dark)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:.7em}
.tf .opt{justify-content:center;min-height:5.2em;font-size:1.5em;text-align:center}
.tf .opt.t{--c:var(--good)} .tf .opt.f{--c:var(--bad)}
.num{display:flex;flex-direction:column;gap:.8em;align-items:center}
.num .val{font-size:3.2em;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.num .val small{font-size:.32em;color:var(--mut);letter-spacing:0;display:block;text-align:center;margin-top:.3em}
.num input[type=range]{width:100%;height:48px;accent-color:var(--acc);touch-action:pan-y}
.num .ends{display:flex;justify-content:space-between;width:100%;color:var(--mut);font-size:.85em;font-variant-numeric:tabular-nums;margin-top:-.6em}
.num .steps{display:flex;gap:.5em;width:100%}
.num .steps .btn{flex:1;padding:.5em .2em;font-variant-numeric:tabular-nums}
.ord{display:flex;flex-direction:column;gap:8px;position:relative}
.ord .it{display:flex;align-items:center;gap:.6em;padding:0 .5em 0 .7em;height:56px;border-radius:.8em;background:var(--bg2);border:2px solid var(--line);font-weight:900;font-size:1.1em;touch-action:none;cursor:grab;transition:transform .15s}
.ord .it .av{--s:2em} .ord .it .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord .it .k{width:1.4em;color:var(--mut);font-variant-numeric:tabular-nums}
.ord .it.drag{transition:none;z-index:2;border-color:#fff;background:var(--bg3);box-shadow:0 8px 20px #0008;cursor:grabbing}
.ord .it .mv{width:40px;height:44px;border-radius:8px;background:var(--bg3);font-size:.8em;display:grid;place-items:center}
.ord .ends{display:flex;justify-content:space-between;color:var(--mut);font-size:.8em;text-transform:uppercase;letter-spacing:.1em;font-weight:800}

/* one-screen turns */
.turn{gap:calc(var(--u)*2)}
.turn .av.huge{--s:calc(var(--u)*16);min-width:90px;min-height:90px}
.turn .aw{font-size:clamp(15px,calc(var(--u)*1.9),26px);max-width:min(100%,640px)}
.turn .prompt{font-size:max(19px,calc(var(--u)*3))}
@media (min-aspect-ratio: 1/1){ .turn .ord .it{height:clamp(38px,calc(var(--u)*3.7),56px)} .turn .ord{gap:6px} .turn .ord .it .mv{height:80%} }
.turn .who{display:flex;align-items:center;gap:.6em;font-size:max(17px,calc(var(--u)*2.4));font-weight:900}
.turn .who .av{--s:1.8em}

/* ---------- phone ---------- */
body[data-role=player]{overflow:auto}
body[data-role=player] #app{position:relative;min-height:100dvh;height:auto}
.ph{flex:1;display:flex;flex-direction:column;gap:16px;padding:14px 16px calc(18px + env(safe-area-inset-bottom));max-width:520px;width:100%;margin:0 auto;font-size:17px;min-height:100dvh}
.ph .head{display:flex;align-items:center;gap:10px;font-weight:900}
.ph .head .av{--s:40px} .ph .head .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:19px}
.ph .head .sc{font-variant-numeric:tabular-nums;background:var(--bg2);border-radius:99px;padding:6px 12px;font-size:16px}
.ph .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.ph h1{font-size:34px;line-height:1.02;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
.ph .q{font-size:22px;line-height:1.15;font-weight:900;text-wrap:balance;text-align:left}
.ph .quote{background:var(--ink);color:var(--dark);border-radius:14px;padding:12px 14px;font-size:18px;line-height:1.2;font-weight:800;text-align:left}
.ph .meta{display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap}
.ph .meta .sp{flex:1}
.ph .tbar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden}
.ph .tbar i{display:block;height:100%;background:var(--acc);transform-origin:left;width:100%}
.ph .big{font-size:64px;font-weight:900;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ph .res.good .big{color:var(--good)} .ph .res.part .big{color:#ffd23f} .ph .res.zero .big{color:var(--mut)}
.ph .sent{background:var(--bg2);border:2px solid var(--good);border-radius:14px;padding:16px;font-weight:800;display:flex;flex-direction:column;gap:10px;align-items:center}
.ph .banner{position:sticky;top:0;z-index:9;background:var(--bad);color:var(--dark);font-weight:900;padding:8px 12px;border-radius:10px;font-size:14px;text-align:center}
.ph .codein{font-size:40px;font-weight:900;letter-spacing:.3em;text-align:center;text-transform:uppercase;background:var(--bg2);border:3px solid var(--line);border-radius:14px;padding:12px 0 12px .3em;width:100%;
  -webkit-user-select:text;user-select:text}
.ph input.name{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px;width:100%;font-weight:800;-webkit-user-select:text;user-select:text}
.ph .opt.taken{opacity:.35}
.ph .mutebtn{position:fixed;right:10px;bottom:10px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
  .award .rays::before{animation:none}
}
@media (max-aspect-ratio: 1/1){
  .lobby{flex-direction:column;text-align:center;justify-content:flex-start}
  .lobby .join,.lobby .roster{flex:none}
  .lobby .join{align-items:center;flex:none} .lobby .roster{flex:none;width:100%}
  .screen{padding:calc(var(--u)*4) calc(var(--u)*4)}
  .screen h1{font-size:calc(var(--u)*11)} .catcard h1{font-size:calc(var(--u)*13)}
  .prompt{font-size:calc(var(--u)*7)} .qcard{font-size:calc(var(--u)*5.6)} .qcard.long{font-size:calc(var(--u)*4.6)}
  .rev .prompt{font-size:calc(var(--u)*4)}
  .ansline .nm{font-size:calc(var(--u)*11)} .ansline .av{--s:calc(var(--u)*14)}
  .bignum{font-size:calc(var(--u)*14)} .bigstamp{font-size:calc(var(--u)*8.5)}
  .rank{--bs:.5}
  .rank .row{grid-template-columns:1.2em 2em 4.2em 1fr}
  .board .row{grid-template-columns:1.2em 2em 4.6em 1fr 3.6em}
  .podium .p{width:30%} .podium .p .nm{font-size:calc(var(--u)*3.8)} .podium .p .sc{font-size:calc(var(--u)*3)}
  .podium .p .av{--s:calc(var(--u)*10)} .podium .p1 .av{--s:calc(var(--u)*12)}
  .tfcols{gap:calc(var(--u)*8)}
}

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
